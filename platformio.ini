; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:waveshare_2350b]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
framework = picosdk
board = waveshare_rp2350b_core
extra_scripts = post:boards/inject_board_header.py
board_build.cmake_extra_args =
    -DPICO_BOARD=waveshare_rp2350b_core
    -DPICO_STDIO_USB=1
    -DPICO_DEFAULT_BINARY_TYPE=copy_to_ram
; The framework appends its own -Os after build_flags, so it has to be dropped
; with build_unflags rather than just overridden. -Os costs ~22% of the audio
; budget: it declines to inline the header-only DSP components that the whole
; design assumes are inlined. -fno-math-errno lets GCC emit hardware float
; instructions instead of libm calls that have to set errno. Measurements in
; AUDIO_PIPELINE_PERFORMANCE.md.
;
; -Wno-psabi silences pages of "parameter passing for argument of type ... changed
; in GCC 7.1" notes. They come from inside libstdc++'s std::map, instantiated by
; nlohmann/json (which the telemetry sink still needs as its fallback path for
; payload types that can't serialise themselves). The note reports an ARM ABI
; change from 2017 and only matters when linking against objects built by a
; pre-7.1 compiler; everything here is built by one toolchain, so it is noise that
; buries real warnings.
build_unflags = -Os
build_flags =
    -DPLATFORM_RP2350
    -std=c++17
    -O3
    -fno-math-errno
    -Wno-psabi
lib_ldf_mode = deep+
test_transport = custom
build_src_filter = 
    +<*>
    -<main_*.cpp>
    +<main_rp2350.cpp>

; The production firmware, but loaded into SRAM instead of flashed, for
; measurement runs that would otherwise wear out the flash:
;   tools/run_bench.py prod_ram_2350b --timeout 30
[env:prod_ram_2350b]
extends = env:waveshare_2350b
build_unflags = -Os
build_flags =
    -DPLATFORM_RP2350
    -std=c++17
    -O3
    -fno-math-errno
    -Wno-psabi
    -DPROFILE_RENDER_HEARTBEAT
board_build.cmake_extra_args =
    -DPICO_BOARD=waveshare_rp2350b_core
    -DPICO_STDIO_USB=1
    -DPICO_DEFAULT_BINARY_TYPE=no_flash

; Audio pipeline benchmark. Loads straight into SRAM (no_flash) so the many
; iterations of a profiling session don't wear out the flash:
;   pio run -e bench_2350b
;   picotool load -x -f .pio/build/bench_2350b/firmware.elf
; This one keeps the old -Os settings, retained so the cost of size-optimising the
; DSP stays visible; bench_2350b_o2 matches what waveshare_2350b now ships.
[env:bench_2350b]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
framework = picosdk
board = waveshare_rp2350b_core
extra_scripts = post:boards/inject_board_header.py
board_build.cmake_extra_args =
    -DPICO_BOARD=waveshare_rp2350b_core
    -DPICO_STDIO_USB=1
    -DPICO_DEFAULT_BINARY_TYPE=no_flash
build_flags =
    -DPLATFORM_RP2350
    -DBIQUAD_PROFILE_UPDATES
    -std=c++17
    -Wno-psabi
lib_ldf_mode = deep+
build_src_filter =
    +<*>
    -<main_*.cpp>
    +<main_rp2350_bench.cpp>

; Same benchmark built for speed instead of size. The framework appends its own
; -Os *after* build_flags, so it has to be removed with build_unflags rather than
; just overridden.
[env:bench_2350b_o2]
extends = env:bench_2350b
build_unflags = -Os
build_flags =
    -DPLATFORM_RP2350
    -DBIQUAD_PROFILE_UPDATES
    -std=c++17
    -O3
    -fno-math-errno
    -Wno-psabi

[env:esp32dev]
platform = espressif32
framework = espidf
board = esp32doit-devkit-v1
board_build.esp-idf.preserve_source_file_extension = yes
build_flags = 
	-DPLATFORM_ESP32 
	-std=c++17
monitor_speed = 115200
test_ignore = test_desktop
build_src_filter = 
	+<*>
	-<main_*.cpp>
	+<main_esp32.cpp>
lib_ldf_mode = deep+

[env:native]
platform = native
build_flags = 
	-DPLATFORM_NATIVE 
	-std=c++17
	-DFEATURE_CLIPBOARD
build_unflags = -std=gnu++11
lib_deps = 
lib_extra_dirs = 
build_src_flags = -lasound
test_ignore = test_embedded
build_src_filter = 
	+<*>
	-<main_*.cpp>
	+<main_linux.cpp>
lib_ldf_mode = deep+

; Diagnostic variants used to bisect what causes render-time jitter on core 1.
; Not for shipping - each one disables real functionality.
[env:prof_no_keytel_2350b]
extends = env:prod_ram_2350b
build_unflags = -Os
build_flags =
    -DPLATFORM_RP2350
    -std=c++17
    -O3
    -fno-math-errno
    -Wno-psabi
    -DPROFILE_RENDER_HEARTBEAT
    -DPROFILE_NO_KEY_TELEMETRY

[env:prof_parked_2350b]
extends = env:prod_ram_2350b
build_unflags = -Os
build_flags =
    -DPLATFORM_RP2350
    -std=c++17
    -O3
    -fno-math-errno
    -Wno-psabi
    -DPROFILE_RENDER_HEARTBEAT
    -DPROFILE_NO_KEY_TELEMETRY
    -DPROFILE_PARK_CORE0

